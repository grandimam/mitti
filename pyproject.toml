[project]
name = "mitti"
version = "0.1.0"
description = "A Python ASGI framework unifying concurrent and parallel execution behind a synchronous application model."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Fauzan", email = "13032255+grandimam@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
keywords = ["asgi", "web", "framework", "async", "parallel", "concurrency"]
dependencies = []

[project.urls]
Homepage = "https://github.com/wayofpy/mitti"
Source = "https://github.com/wayofpy/mitti"
Issues = "https://github.com/wayofpy/mitti/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitti"]

[tool.hatch.build.targets.sdist]
include = ["src/mitti"]
